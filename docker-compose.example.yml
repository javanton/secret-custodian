# Example deployment of Secret Guardian. Copy to docker-compose.yml and adjust.
#
# Setup:
#   1. Create the master key once and back it up (losing it means losing every stored secret):
#        docker run --rm -v "$PWD":/out --entrypoint sg secret-guardian:dev keygen --out /out/sg.key
#      (or `sg keygen --out sg.key` on the host). The file is mode 0600 and owned by you.
#   2. The key is delivered as a Docker secret. Compose file-based secrets are bind-mounted with the
#      host file's ownership, so the `uid`/`mode` below only take effect with Swarm; with plain
#      `docker compose` make the HOST file readable only by uid 10001:
#        sudo chown 10001:10001 sg.key && sudo chmod 0400 sg.key
#      Alternative without any file: set SG_MASTER_KEY (the same base64 value) in `environment:` and
#      drop the `--key-file` option from `command:`. The file route is preferred; env vars show up in
#      `docker inspect`.
#   3. docker compose up -d --build
#   4. Configure the vault with the CLI over the in-container admin socket:
#        docker compose exec secret-guardian sg secret ls
#        printf %s "$TOKEN" | docker compose exec -T secret-guardian sg secret add github
#        docker compose exec secret-guardian sg token create --machine agent1 --role reviewer \
#            --proxy-url http://secret-guardian:8080
#      Web UI: docker compose exec secret-guardian sg login-url   (open the printed link on the host,
#      it points to http://localhost:9090).
#
# Security notes:
#   * The admin UI has NO remote login: it is published on the host loopback only, and every session
#     still needs a single-use login token from `sg login-url`.
#   * Both ports live in the same container, so an agent container on the `agents` network CAN reach
#     the admin port (secret-guardian:9090). That is why the proxy refuses to relay to its own ports
#     and the admin UI rejects unexpected Host/Origin headers and requires the login token. Keep
#     untrusted code off the host's loopback and do not publish 9090 on other interfaces.
#   * The `agents` network is `internal`: agents can only talk to the vault, never straight to the
#     internet, so the proxy is the only way out. The vault itself also sits on `egress` to reach
#     the upstream APIs.
services:
  secret-guardian:
    image: secret-guardian:dev
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"   # admin UI, host loopback only
    # The proxy (8080) is NOT published: agent containers reach it as http://secret-guardian:8080.
    volumes:
      - sg-data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    secrets:
      - source: sg_key
        uid: "10001"   # honoured by Swarm only; see note 2 above
        gid: "10001"
        mode: 0400
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    networks: [agents, egress]

  # Example agent: everything it sends over HTTP(S) goes through the vault, which injects credentials.
  # Create a token first (see step 4) and put the HTTPS_PROXY line it prints in the environment.
  # The CA is exported with `docker compose exec secret-guardian sg ca export > sg-ca.pem`.
  #
  # agent:
  #   image: curlimages/curl
  #   command: ["curl", "-sS", "https://api.github.com/user"]
  #   networks: [agents]
  #   environment:
  #     HTTPS_PROXY: "http://agent1:<TOKEN>@secret-guardian:8080"
  #     SSL_CERT_FILE: /certs/sg-ca.pem
  #     CURL_CA_BUNDLE: /certs/sg-ca.pem
  #     NODE_EXTRA_CA_CERTS: /certs/sg-ca.pem
  #     REQUESTS_CA_BUNDLE: /certs/sg-ca.pem
  #   volumes:
  #     - ./sg-ca.pem:/certs/sg-ca.pem:ro
  #   read_only: true
  #   cap_drop: [ALL]
  #   security_opt: ["no-new-privileges:true"]

networks:
  agents:
    internal: true
  egress: {}

volumes:
  sg-data:

secrets:
  sg_key:
    file: ./sg.key
