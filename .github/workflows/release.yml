name: Release

# A tag vX.Y.Z builds the static x86_64 musl binary, attaches it (with SHA256SUMS) to a GitHub
# Release, and pushes the Docker image to the GitHub Container Registry. See docs/releasing.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write    # create the Release and upload assets
  packages: write    # push to ghcr.io

jobs:
  binary:
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install musl target and musl-gcc
        run: |
          apt-get update -qq && apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Build and package (fails if the tag disagrees with Cargo.toml, or the binary is not static)
        run: scripts/package-release.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-release:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the GitHub Release with the archive and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Secret Custodian ${{ github.ref_name }}" \
            --notes "Static Linux x86_64 binary (musl). Verify the download with SHA256SUMS (sha256sum -c SHA256SUMS). Container image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}"

  publish-image:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push :vX.Y.Z and :latest
        run: |
          set -eu
          IMAGE="ghcr.io/${{ github.repository }}"
          docker build -t "$IMAGE:${{ github.ref_name }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE:latest"
